<!DOCTYPE html>
<!--
  ┌─────────────────────────────────────────────────────────────────────┐
  │  JOHNSON HOUSEHOLD COFFEE BAR — morning ordering app                  │
  │  Single self-contained file. No dependencies. Drop on GitHub Pages.   │
  │                                                                       │
  │  ► TO MAKE ORDERS AUTO-EMAIL TO YOU (recommended, ~2 min, free):      │
  │     1. Go to https://web3forms.com  → enter briceljohnson@gmail.com   │
  │     2. They email you an "Access Key" (a long code).                  │
  │     3. Paste that code between the quotes in WEB3FORMS_KEY below.      │
  │     Done — every order then lands in your inbox automatically.        │
  │                                                                       │
  │  ► IF YOU LEAVE THE KEY BLANK:                                        │
  │     The app still works. Each order shows "Text it" / "Email it"      │
  │     buttons that open the orderer's Messages/Mail addressed to you.   │
  │                                                                       │
  │  Your contact info is set in the CONFIG block below — change anytime. │
  └─────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnson Household Coffee Bar</title>
<style>
  /* ───────── Tokens: a 6am kitchen — dark espresso lit by warm crema light ───────── */
  :root{
    --bg:#211A16;          /* deep espresso */
    --bg-deep:#1A140F;     /* darker, for the sticky tray */
    --card:#2C2219;        /* lifted surface */
    --card-hi:#3A2C1E;     /* selected surface */
    --cream:#F4ECDD;       /* primary text */
    --muted:#B5A491;       /* steam / secondary text */
    --faint:#7E6E5E;       /* hairline-ish text */
    --crema:#E2A85B;       /* the golden layer on espresso = the signature */
    --crema-deep:#C9863B;
    --milk:#EFE6D4;
    --line:rgba(226,168,91,.18);
    --line-soft:rgba(244,236,221,.10);
    --radius:15px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --serif:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 520px at 50% -8%, rgba(226,168,91,.16), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    min-height:100dvh;
    padding-bottom:120px; /* room for sticky tray bar */
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}

  /* ───────── Header / signature ───────── */
  header{padding:38px 0 22px;text-align:center}
  .mark{display:inline-flex;align-items:flex-end;justify-content:center;gap:0;margin-bottom:14px}
  .steam{transform-origin:center bottom}
  @keyframes rise{
    0%{opacity:0;transform:translateY(4px) scaleY(.85)}
    35%{opacity:.85}
    100%{opacity:0;transform:translateY(-9px) scaleY(1.15)}
  }
  .s1{animation:rise 3.2s ease-in-out infinite}
  .s2{animation:rise 3.2s ease-in-out infinite .9s}
  .s3{animation:rise 3.2s ease-in-out infinite 1.8s}
  @media (prefers-reduced-motion:reduce){.s1,.s2,.s3{animation:none;opacity:.5}}

  .eyebrow{
    font-family:var(--sans);
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--crema);font-weight:600;margin:0 0 6px
  }
  h1{
    font-family:var(--serif);
    font-weight:400;font-style:italic;
    font-size:clamp(34px,9vw,48px);
    line-height:1;margin:0;color:var(--cream)
  }
  .greeting{color:var(--muted);margin:14px 0 0;font-size:15px}

  .rule{height:1px;background:var(--line);margin:26px 0}
  .rule.dotted{background:none;border-top:1px dotted var(--line);margin:22px 0}

  /* ───────── Menu ───────── */
  .group-label{
    font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:10px
  }
  .group-label::after{content:"";flex:1;height:1px;background:var(--line-soft)}

  .menu{display:flex;flex-direction:column;gap:9px;margin-bottom:26px}
  .item{
    display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
    background:var(--card);border:1px solid transparent;color:inherit;
    border-radius:var(--radius);padding:14px 16px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .05s;font-family:inherit
  }
  .item:hover{border-color:var(--line)}
  .item:active{transform:scale(.995)}
  .item.sel{background:var(--card-hi);border-color:var(--crema)}
  .item .nm{font-family:var(--serif);font-size:19px;color:var(--cream);white-space:nowrap}
  .item .ds{color:var(--muted);font-size:13.5px;flex:1}
  .item .tick{
    width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);
    flex:none;align-self:center;display:grid;place-items:center;transition:.15s
  }
  .item.sel .tick{background:var(--crema);border-color:var(--crema)}
  .item .tick svg{opacity:0;transition:.15s}
  .item.sel .tick svg{opacity:1}

  /* ───────── Options panel ───────── */
  #builder{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;margin-bottom:8px;display:none;box-shadow:var(--shadow)
  }
  #builder.open{display:block}
  .b-head{font-family:var(--serif);font-size:21px;margin:0 0 2px;color:var(--cream)}
  .b-sub{color:var(--muted);font-size:13px;margin:0 0 18px}

  .field{margin-bottom:16px}
  .field > label{
    display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin-bottom:9px
  }
  .field input[type=text]{
    width:100%;background:var(--bg);border:1px solid var(--line-soft);color:var(--cream);
    border-radius:11px;padding:12px 13px;font-size:16px;font-family:inherit
  }
  .field input[type=text]:focus{outline:2px solid var(--crema);outline-offset:1px;border-color:transparent}
  .field input::placeholder{color:var(--faint)}

  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{
    background:var(--bg);border:1px solid var(--line-soft);color:var(--muted);
    border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit;
    transition:.13s
  }
  .pill:hover{border-color:var(--line);color:var(--cream)}
  .pill.on{background:var(--crema);border-color:var(--crema);color:#241a10;font-weight:600}
  .pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;border:1px solid rgba(0,0,0,.12)}

  .addbtn{
    width:100%;margin-top:6px;background:var(--cream);color:#23190f;border:none;
    border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    letter-spacing:.01em;transition:.13s
  }
  .addbtn:hover{background:#fff}
  .addbtn:active{transform:scale(.99)}

  /* ───────── Tray (sticky) ───────── */
  .tray-empty{color:var(--faint);font-size:13.5px;text-align:center;padding:8px 0 4px;font-style:italic}
  .tray-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 0}
  .order{
    display:flex;gap:12px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px
  }
  .order .who{font-family:var(--serif);font-size:16px;color:var(--crema);min-width:0}
  .order .what{flex:1;min-width:0}
  .order .what b{font-weight:600;color:var(--cream)}
  .order .what .spec{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .order .rm{
    background:none;border:none;color:var(--faint);cursor:pointer;font-size:20px;
    line-height:1;padding:2px 4px;flex:none
  }
  .order .rm:hover{color:var(--crema)}

  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(180deg, rgba(26,20,15,.0), var(--bg-deep) 22%);
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
  }
  .bar-inner{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
  .count{font-size:13px;color:var(--muted);flex:none}
  .count b{color:var(--cream);font-size:15px}
  .send{
    flex:1;background:var(--crema);color:#231708;border:none;border-radius:13px;
    padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 20px rgba(226,168,91,.28);transition:.13s;letter-spacing:.01em
  }
  .send:hover{background:var(--crema-deep)}
  .send:disabled{background:#3a2f24;color:var(--faint);box-shadow:none;cursor:not-allowed}
  .send:not(:disabled):active{transform:scale(.99)}

  footer{text-align:center;color:var(--faint);font-size:12px;padding:14px 0 4px}
  footer .heart{color:var(--crema)}

  /* ───────── Confirmation overlay ───────── */
  .scrim{
    position:fixed;inset:0;z-index:60;background:rgba(15,11,8,.74);
    display:none;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(3px)
  }
  .scrim.show{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)
  }
  .modal .cup{margin-bottom:12px}
  .modal h2{font-family:var(--serif);font-weight:400;font-size:25px;margin:0 0 6px}
  .modal p{color:var(--muted);font-size:14.5px;margin:0 0 18px}
  .modal .actions{display:flex;flex-direction:column;gap:10px}
  .modal a.btn,.modal button.btn{
    display:block;text-decoration:none;border-radius:12px;padding:13px;font-size:15px;
    font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--line)
  }
  .btn-text{background:var(--crema);color:#231708;border-color:var(--crema)}
  .btn-mail{background:var(--bg);color:var(--cream)}
  .btn-done{background:none;color:var(--faint);border:none;padding:8px;font-weight:600}
  .modal .note{color:var(--faint);font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark" aria-hidden="true">
      <svg width="62" height="62" viewBox="0 0 62 62" fill="none">
        <!-- steam -->
        <path class="steam s1" d="M24 16c0-3 3-3 3-6" stroke="#E2A85B" stroke-width="2.2" stroke-linecap="round"/>
        <path class="steam s2" d="M31 16c0-3 3-3 3-6" stroke="#E2A85B" stroke-width="2.2" stroke-linecap="round"/>
        <path class="steam s3" d="M38 16c0-3 3-3 3-6" stroke="#E2A85B" stroke-width="2.2" stroke-linecap="round"/>
        <!-- cup -->
        <path d="M16 26h27v9a11 11 0 0 1-11 11h-5a11 11 0 0 1-11-11v-9Z" fill="#2C2219" stroke="#F4ECDD" stroke-width="2.2"/>
        <path d="M43 29h4a5 5 0 0 1 0 10h-4" stroke="#F4ECDD" stroke-width="2.2"/>
        <path d="M16 26h27" stroke="#E2A85B" stroke-width="2.6"/>
        <path d="M15 52h32" stroke="#F4ECDD" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="eyebrow">Johnson Household</p>
    <h1>Coffee Bar</h1>
    <p class="greeting">Good morning. Pick a drink, make it yours, send it down to the kitchen.</p>
  </header>

  <div class="rule"></div>

  <!-- Menu renders here -->
  <div id="menu-espresso-label" class="group-label">Espresso Bar</div>
  <div id="menu-espresso" class="menu"></div>

  <div id="menu-pour-label" class="group-label">Pour Over</div>
  <div id="menu-pour" class="menu"></div>

  <!-- Builder -->
  <div id="builder">
    <p class="b-head" id="b-head">—</p>
    <p class="b-sub" id="b-sub"></p>

    <div class="field">
      <label for="forName">Who's it for?</label>
      <input type="text" id="forName" placeholder="e.g. Grandma, Theo, me…" autocomplete="off">
    </div>

    <div class="field" id="f-shots">
      <label>Espresso</label>
      <div class="pills" data-group="shots"></div>
    </div>

    <div class="field" id="f-milk">
      <label>Milk</label>
      <div class="pills" data-group="milk"></div>
    </div>

    <div class="field">
      <label>Flavor</label>
      <div class="pills" data-group="flavor"></div>
    </div>

    <div class="field">
      <label>Temperature</label>
      <div class="pills" data-group="temp"></div>
    </div>

    <div class="field">
      <label for="notes">Anything else? (optional)</label>
      <input type="text" id="notes" placeholder="extra hot, light pour, extra foam…" autocomplete="off">
    </div>

    <button class="addbtn" id="addBtn">Add to tray</button>
  </div>

  <div class="rule dotted"></div>

  <div class="group-label">The Tray</div>
  <div id="tray"></div>

  <footer>Brewed at home for the Johnson Household <span class="heart">●</span></footer>
</div>

<!-- Sticky send bar -->
<div class="bar">
  <div class="bar-inner">
    <div class="count"><b id="countNum">0</b> <span id="countWord">drinks</span></div>
    <button class="send" id="sendBtn" disabled>Send order</button>
  </div>
</div>

<!-- Confirmation -->
<div class="scrim" id="scrim">
  <div class="modal">
    <div class="cup" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 62 62" fill="none">
        <path d="M16 26h27v9a11 11 0 0 1-11 11h-5a11 11 0 0 1-11-11v-9Z" fill="#3A2C1E" stroke="#E2A85B" stroke-width="2.4"/>
        <path d="M43 29h4a5 5 0 0 1 0 10h-4" stroke="#E2A85B" stroke-width="2.4"/>
        <path d="M15 52h32" stroke="#E2A85B" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h2 id="modalTitle">Order's in!</h2>
    <p id="modalMsg">Sent down to the kitchen.</p>
    <div class="actions" id="modalActions"></div>
    <p class="note" id="modalNote"></p>
  </div>
</div>

<script>
/* ════════════════════ CONFIG — edit these ════════════════════ */
const CONFIG = {
  email: "briceljohnson@gmail.com",
  phone: "765-719-2959",          // shown to family; used for the "Text it" button
  // Paste your free Web3Forms access key here to auto-email orders to the address above.
  // Leave as "" to use the manual Text / Email buttons instead (no signup needed).
  WEB3FORMS_KEY: ""
};
/* ═══════════════════════════════════════════════════════════════ */

/* ── Menu data ── */
const DRINKS = [
  {g:"espresso", name:"Espresso",     desc:"Two shots, pulled bright and bold.", shots:true,  milk:"none"},
  {g:"espresso", name:"Americano",    desc:"Espresso loosened with hot water.",   shots:true,  milk:"opt"},
  {g:"espresso", name:"Macchiato",    desc:"Espresso marked with a dollop of foam.", shots:true, milk:"foam"},
  {g:"espresso", name:"Cortado",      desc:"Equal parts espresso and warm milk.", shots:true,  milk:"yes"},
  {g:"espresso", name:"Cappuccino",   desc:"Espresso under a tall cap of foam.",  shots:true,  milk:"yes"},
  {g:"espresso", name:"Flat White",   desc:"Espresso and silky microfoam.",       shots:true,  milk:"yes"},
  {g:"espresso", name:"Latte",        desc:"Espresso and steamed milk, smooth and easy.", shots:true, milk:"yes"},
  {g:"pour",     name:"V60 Pour Over",   desc:"Clean and bright, brewed by the cup.", shots:false, milk:"opt"},
  {g:"pour",     name:"Chemex Pour Over",desc:"Smooth and rounded, brewed slow.",     shots:false, milk:"opt"},
];

const OPTS = {
  shots:  [["Single shot","single"],["Double shot","double"]],
  milk:   [["None","none"],["Whole milk","whole"]],
  flavor: [["None","none"],["Cookie butter","cookie butter"],["Oreo","oreo"],["Caramel","caramel"],["Hazelnut","hazelnut"],["Maple / Cinnamon","maple/cinnamon"]],
  temp:   [["Hot","hot"],["Iced","iced"]],
};
const MILK_SWATCH = {none:"transparent", whole:"#F3ECDB"};

/* ── State ── */
let selected = null;          // index into DRINKS
let choice = {};              // current builder selections
const tray = [];

/* ── Render menu ── */
function renderMenu(){
  const tick = '<span class="tick"><svg width="11" height="11" viewBox="0 0 12 12"><path d="M2.5 6.5l2.5 2.5 4.5-5" stroke="#231708" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  ["espresso","pour"].forEach(gKey=>{
    const host = document.getElementById(gKey==="espresso"?"menu-espresso":"menu-pour");
    host.innerHTML = "";
    DRINKS.forEach((d,i)=>{
      if(d.g!==gKey) return;
      const b = document.createElement("button");
      b.className = "item";
      b.dataset.i = i;
      b.innerHTML = `<span class="nm">${d.name}</span><span class="ds">${d.desc}</span>${tick}`;
      b.addEventListener("click",()=>selectDrink(i));
      host.appendChild(b);
    });
  });
}

/* ── Select a drink → open builder ── */
function selectDrink(i){
  selected = i;
  const d = DRINKS[i];
  document.querySelectorAll(".item").forEach(el=>el.classList.toggle("sel", +el.dataset.i===i));

  // sensible defaults per drink
  choice = {
    shots: d.shots ? "double" : null,
    milk:  d.milk==="yes" || d.milk==="foam" ? "whole" : "none",
    flavor:"none", temp:"hot"
  };

  document.getElementById("b-head").textContent = d.name;
  document.getElementById("b-sub").textContent = d.desc;
  document.getElementById("forName").value = "";
  document.getElementById("notes").value = "";

  // show/hide conditional fields
  document.getElementById("f-shots").style.display = d.shots ? "block" : "none";
  // Only whole milk on hand: offer a choice only where milk is optional; milk drinks just get whole.
  document.getElementById("f-milk").style.display  = d.milk==="opt" ? "block" : "none";
  document.querySelector('#f-milk label').textContent = "Whole milk (optional)";

  buildPills();
  const b = document.getElementById("builder");
  b.classList.add("open");
  b.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ── Pills ── */
function buildPills(){
  Object.keys(OPTS).forEach(group=>{
    const host = document.querySelector(`.pills[data-group="${group}"]`);
    if(!host) return;
    host.innerHTML = "";
    OPTS[group].forEach(([label,val])=>{
      const p = document.createElement("button");
      p.className = "pill" + (choice[group]===val ? " on":"");
      p.type="button";
      let inner = label;
      if(group==="milk" && val!=="none"){
        inner = `<span class="dot" style="background:${MILK_SWATCH[val]||'#ccc'}"></span>${label}`;
      }
      p.innerHTML = inner;
      p.addEventListener("click",()=>{
        choice[group]=val;
        host.querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));
        p.classList.add("on");
      });
      host.appendChild(p);
    });
  });
}

/* ── Add to tray ── */
document.getElementById("addBtn").addEventListener("click",()=>{
  if(selected===null) return;
  const d = DRINKS[selected];
  const who = document.getElementById("forName").value.trim() || "—";
  const notes = document.getElementById("notes").value.trim();

  const specs = [];
  if(d.shots) specs.push(choice.shots==="single" ? "single shot" : "double shot");
  if(choice.milk==="whole") specs.push("whole milk");
  if(choice.flavor!=="none") specs.push(choice.flavor);
  specs.push(choice.temp);
  if(notes) specs.push("“"+notes+"”");

  tray.push({drink:d.name, who, spec:specs.join(" · ")});
  renderTray();

  document.getElementById("builder").classList.remove("open");
  document.querySelectorAll(".item").forEach(el=>el.classList.remove("sel"));
  selected = null;
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
});

/* ── Tray render ── */
function renderTray(){
  const host = document.getElementById("tray");
  if(tray.length===0){
    host.innerHTML = '<p class="tray-empty">Nothing yet — pick a drink above.</p>';
  } else {
    host.innerHTML = '<div class="tray-list"></div>';
    const list = host.querySelector(".tray-list");
    tray.forEach((o,idx)=>{
      const row = document.createElement("div");
      row.className="order";
      row.innerHTML =
        `<span class="who">${esc(o.who)}</span>
         <span class="what"><b>${esc(o.drink)}</b><span class="spec">${esc(o.spec)}</span></span>
         <button class="rm" title="Remove" aria-label="Remove">×</button>`;
      row.querySelector(".rm").addEventListener("click",()=>{tray.splice(idx,1);renderTray();});
      list.appendChild(row);
    });
  }
  document.getElementById("countNum").textContent = tray.length;
  document.getElementById("countWord").textContent = tray.length===1 ? "drink":"drinks";
  document.getElementById("sendBtn").disabled = tray.length===0;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ── Compose order text ── */
function orderText(){
  const t = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  let body = `☕ Coffee order — Johnson Household\n${tray.length} ${tray.length===1?"drink":"drinks"} · ${t}\n\n`;
  tray.forEach((o,i)=>{ body += `${i+1}. ${o.drink} — for ${o.who}\n   ${o.spec}\n`; });
  return body;
}

/* ── Send ── */
document.getElementById("sendBtn").addEventListener("click", sendOrder);

async function sendOrder(){
  if(tray.length===0) return;
  const body = orderText();
  const subject = `☕ Coffee order — Johnson Household (${tray.length})`;
  const btn = document.getElementById("sendBtn");

  if(CONFIG.WEB3FORMS_KEY){
    btn.disabled = true; btn.textContent = "Sending…";
    try{
      const res = await fetch("https://api.web3forms.com/submit",{
        method:"POST",
        headers:{"Content-Type":"application/json", Accept:"application/json"},
        body: JSON.stringify({
          access_key: CONFIG.WEB3FORMS_KEY,
          subject, from_name:"Johnson Household Coffee Bar", message: body
        })
      });
      const data = await res.json();
      if(data.success){ showConfirm(true, body, subject); resetAfterSend(); }
      else throw new Error(data.message||"send failed");
    }catch(err){
      showConfirm(false, body, subject, "Auto-send didn't go through — use a button below.");
    }finally{ btn.disabled=false; btn.textContent="Send order"; }
  } else {
    showConfirm(false, body, subject);
  }
}

function resetAfterSend(){ /* keep tray so they can re-text if needed; nothing to clear */ }

/* ── Confirmation modal ── */
function showConfirm(auto, body, subject, noteOverride){
  const enc = encodeURIComponent(body);
  const sms = `sms:${CONFIG.phone}?&body=${enc}`;
  const mail = `mailto:${CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${enc}`;
  const actions = document.getElementById("modalActions");

  document.getElementById("modalTitle").textContent = auto ? "Order's in!" : "Almost there";
  document.getElementById("modalMsg").textContent = auto
    ? "Emailed down to the kitchen. The barista's on it."
    : "Pick how to send it to the kitchen:";

  actions.innerHTML = "";
  if(auto){
    actions.innerHTML =
      `<a class="btn btn-mail" href="${sms}">Also text it to Brice</a>
       <button class="btn btn-done" onclick="closeConfirm(true)">Start a new order</button>`;
  } else {
    actions.innerHTML =
      `<a class="btn btn-text" href="${sms}">Text it to Brice</a>
       <a class="btn btn-mail" href="${mail}">Email it to Brice</a>
       <button class="btn btn-done" onclick="closeConfirm(false)">Back</button>`;
  }
  document.getElementById("modalNote").textContent =
    noteOverride || (auto ? "" : "This opens your Messages or Mail with the order ready — just hit send.");
  document.getElementById("scrim").classList.add("show");
}
function closeConfirm(clear){
  document.getElementById("scrim").classList.remove("show");
  if(clear){ tray.length=0; renderTray(); window.scrollTo({top:0,behavior:"smooth"}); }
}
document.getElementById("scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeConfirm(false); });

/* ── Init ── */
renderMenu();
renderTray();
</script>
</body>
</html>
